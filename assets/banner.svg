<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0f2a16" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .title { font-size: 76px; font-weight: 800; letter-spacing: 6px; }
      .trace { fill: none; stroke: #39ff14; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 14 420; animation: run 4s linear infinite; opacity: .85; }
      .trace.r { stroke: #ff2a3d; animation-duration: 5.5s; }
      .trace.d1 { animation-delay: -1.2s; } .trace.d2 { animation-delay: -2.6s; } .trace.d3 { animation-delay: -3.4s; }
      .base { fill: none; stroke: #133d1d; stroke-width: 2; }
      .pad { fill: #0a0a0a; stroke: #1f6b2e; stroke-width: 2; }
      @keyframes run { from { stroke-dashoffset: 434; } to { stroke-dashoffset: 0; } }
      .gR { animation: gr 3s steps(1) infinite; } .gC { animation: gc 3s steps(1) infinite; }
      @keyframes gr { 0%,88%,100% { transform: translate(0,0); opacity:0 } 90% { transform: translate(-6px,2px); opacity:.9 } 93% { transform: translate(5px,-2px); opacity:.9 } 96% { transform: translate(-2px,0); opacity:.6 } }
      @keyframes gc { 0%,88%,100% { transform: translate(0,0); opacity:0 } 90% { transform: translate(6px,-2px); opacity:.9 } 93% { transform: translate(-5px,2px); opacity:.9 } 96% { transform: translate(2px,0); opacity:.6 } }
      .line { opacity: 0; animation: show 12s steps(1) infinite; }
      .l1 { animation-delay: 0s; } .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
      @keyframes show { 0% { opacity: 1 } 25% { opacity: 0 } 100% { opacity: 0 } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .led { animation: blink 1.4s steps(1) infinite; } .led.b { animation-duration: .9s; } .led.c { animation-duration: 2.1s; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#050805"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- PCB traces: base copper + moving signal pulses -->
  <g>
    <path class="base" d="M0 60H140L170 30H330"/>
    <path class="base" d="M0 270H90L130 230H260L290 260H380"/>
    <path class="base" d="M1200 50H1060L1030 80H880"/>
    <path class="base" d="M1200 280H1100L1070 250H930L900 290H820"/>
    <path class="base" d="M40 0V110L70 140H160"/>
    <path class="base" d="M1160 320V200L1130 170H1040"/>
    <path class="trace" d="M0 60H140L170 30H330"/>
    <path class="trace r d1" d="M0 270H90L130 230H260L290 260H380"/>
    <path class="trace d2" d="M1200 50H1060L1030 80H880"/>
    <path class="trace d3" d="M1200 280H1100L1070 250H930L900 290H820"/>
    <path class="trace r d2" d="M40 0V110L70 140H160"/>
    <path class="trace d1" d="M1160 320V200L1130 170H1040"/>
    <circle class="pad" cx="330" cy="30" r="6"/><circle class="pad" cx="380" cy="260" r="6"/>
    <circle class="pad" cx="880" cy="80" r="6"/><circle class="pad" cx="820" cy="290" r="6"/>
    <circle class="pad" cx="160" cy="140" r="6"/><circle class="pad" cx="1040" cy="170" r="6"/>
  </g>

  <!-- status LEDs -->
  <g transform="translate(1056 22)">
    <circle class="led" cx="0" cy="0" r="5" fill="#39ff14" filter="url(#glow)"/>
    <circle class="led b" cx="18" cy="0" r="5" fill="#ff2a3d" filter="url(#glow)"/>
    <circle class="led c" cx="36" cy="0" r="5" fill="#ffb000" filter="url(#glow)"/>
    <text x="52" y="5" class="mono" font-size="13" fill="#2f8a3f">TX RX PWR</text>
  </g>

  <!-- logos -->
  <g>
    <rect x="54" y="76" width="148" height="162" rx="14" fill="#050805" stroke="#1f6b2e" stroke-width="2"/>
    <g transform="translate(70 92) scale(0.2754)" fill-rule="evenodd" filter="url(#glow)"><path fill="#39ff14" d="M190 415L176 406L175 390L174 374L139 353L103 332L103 306L104 279L133 261C150 252 163 244 164 244C164 243 59 62 58 62C55 62 43 85 38 98L36 106L24 106L12 106L12 60L12 13L207 13L402 13L402 60L402 106L390 106C380 106 379 106 378 104C373 88 365 72 359 65L356 62L304 153C263 223 251 243 252 244C253 245 267 253 283 262L313 279L313 297L313 315L309 313C291 302 240 273 239 273C239 273 239 280 239 288C239 297 239 304 239 304C238 304 232 300 223 296C215 291 208 287 208 287C207 287 200 291 191 296L176 305L175 289C175 276 175 274 174 274C171 275 136 295 135 297C133 298 132 311 134 314C134 314 144 320 154 326L174 338L175 322L176 306L207 325L238 343L239 375L239 407L225 415C215 420 210 423 208 423C206 423 199 420 190 415ZM290 130C316 84 338 46 338 45C337 45 334 42 330 41C324 37 322 37 315 37L308 37L278 87C262 115 247 141 244 146L239 154L239 185C239 204 239 215 240 214C240 214 263 176 290 130ZM140 94C121 61 105 34 105 34C103 32 75 44 76 46C80 52 127 133 141 158C152 176 164 196 168 202L174 214L175 184L175 153L140 94ZM264 66C275 46 285 29 285 29C285 28 275 28 262 28L239 28L239 67C239 103 239 106 241 104C241 103 252 86 264 66ZM175 66L175 28L152 28C140 28 130 28 130 29C130 29 174 105 175 105C175 105 175 88 175 66Z"/><path fill="#8a8f8a" d="M154 431L102 400L102 382C102 372 102 364 102 364C103 364 160 397 180 408C200 421 205 423 208 423C210 423 216 420 225 415L239 407L239 375L238 343L208 325C191 315 176 307 176 306C175 305 201 289 206 287C207 287 213 290 223 295C231 300 238 304 238 304C239 304 239 297 239 289C239 274 240 271 242 274C242 275 242 275 241 275C240 274 240 278 240 290L240 305L276 326L312 347L313 374L313 400L261 430C232 447 208 461 208 461C207 461 183 447 154 431ZM265 392L281 382L281 375L281 367L261 356C251 350 241 344 241 344C240 344 240 358 240 375L240 406L245 403C247 402 257 396 265 392ZM102 306C102 282 102 279 104 278C105 277 105 277 104 278C103 279 103 287 103 306L102 332L102 306ZM239 184C239 167 239 153 240 153C241 152 240 214 240 215C239 215 239 201 239 184ZM239 67C239 45 239 28 239 28C240 29 240 105 240 106C239 106 239 89 239 67ZM402 60C402 34 403 23 403 36C403 48 403 70 403 83C403 96 402 85 402 60ZM36 12C40 12 46 12 50 12C54 12 51 13 44 13C36 13 33 12 36 12ZM100 12C104 12 110 12 114 12C118 12 115 13 107 13C99 13 96 12 100 12ZM317 12C330 12 350 12 363 12C375 12 365 13 340 13C315 13 305 12 317 12Z"/></g>
    <rect x="995" y="76" width="151" height="162" rx="14" fill="#050805" stroke="#1f6b2e" stroke-width="2"/>
    <g transform="translate(1011 92) scale(0.2832)" fill-rule="evenodd" filter="url(#glow)"><path fill="#ff2a3d" d="M177 433C166 431 154 422 149 412C147 407 147 406 146 380C146 356 145 354 143 351C140 347 137 345 130 344C113 342 102 331 100 313C98 305 96 302 87 299C75 294 68 287 66 276C64 267 62 265 54 261C29 252 22 229 39 211C50 199 55 198 89 197L116 196L119 194C124 189 124 187 124 161L124 137L116 129C101 115 94 96 96 78C103 26 162 6 199 43C215 59 221 81 216 99C214 103 214 105 215 106C217 108 323 172 365 198C383 208 390 217 391 230C392 243 396 238 296 337C242 391 206 427 203 428C196 433 186 434 177 433ZM191 408C193 406 233 367 280 320C360 239 365 234 365 231C365 229 364 226 364 225C363 224 343 212 319 197C278 172 214 133 191 119L180 112L183 109C201 89 192 58 166 50C135 42 109 73 123 101C127 108 135 116 141 119L146 120L146 169L146 218L103 218L60 218L58 221C52 226 52 234 58 238C63 241 250 241 255 238C260 235 262 228 258 223C255 218 253 218 208 218L166 218L166 173L166 127L180 135C187 140 210 154 230 165C249 177 280 196 297 206C314 217 330 226 332 228L336 230L256 311C211 355 175 392 174 394C168 405 181 416 191 408ZM187 321C192 315 191 306 184 304C179 303 132 303 128 304C121 308 122 320 129 323C131 323 143 324 157 324L183 324L187 321ZM218 280C225 275 223 265 215 262C213 261 199 261 153 261L95 262L92 265C87 270 88 277 94 281C96 282 115 282 156 282C214 282 216 282 218 280ZM147 102C130 94 134 68 154 66C171 65 181 84 170 97C167 101 161 104 156 104C153 104 150 103 147 102Z"/></g>
  </g>

  <!-- title with RGB-split glitch -->
  <g text-anchor="middle" class="mono title">
    <text x="600" y="150" fill="#ff2a3d" class="gR">YOUR PAL KAL</text>
    <text x="600" y="150" fill="#00e5ff" class="gC">YOUR PAL KAL</text>
    <text x="600" y="150" fill="#39ff14" filter="url(#glow)">YOUR PAL KAL</text>
  </g>

  <text x="600" y="190" text-anchor="middle" class="mono" font-size="16" letter-spacing="4" fill="#6bdc7a">
    HARDWARE HACKER · MAKER PROPAGANDIST · ESP32 ENJOYER
  </text>

  <!-- rotating terminal lines -->
  <g class="mono" font-size="18" fill="#c8ffd0">
    <rect x="330" y="222" width="540" height="40" rx="6" fill="#000" stroke="#1f6b2e"/>
    <text x="348" y="248"><tspan fill="#39ff14">kal@valleytech</tspan><tspan fill="#5a5a5a">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#5a5a5a">$ </tspan></text>
    <text x="540" y="248" class="line l1">flash --target esp32-s3 marauder.bin<tspan fill="#39ff14" class="cursor">_</tspan></text>
    <text x="540" y="248" class="line l2">./wardrive --gps --log flock.csv<tspan fill="#39ff14" class="cursor">_</tspan></text>
    <text x="540" y="248" class="line l3">make pcb &amp;&amp; ship --to jlcpcb<tspan fill="#39ff14" class="cursor">_</tspan></text>
    <text x="540" y="248" class="line l4">echo "hack the planet" &gt; /dev/yt<tspan fill="#39ff14" class="cursor">_</tspan></text>
  </g>

  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect width="1200" height="320" fill="url(#vig)"/>
  <rect x="1" y="1" width="1198" height="318" rx="10" fill="none" stroke="#1f6b2e" stroke-width="2"/>
</svg>
