name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#39ff14&color_dots=#0a120b,#0f3d18,#1f6b2e,#2fa844,#39ff14
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2a3d&color_dots=#0a120b,#0f3d18,#1f6b2e,#2fa844,#39ff14

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
