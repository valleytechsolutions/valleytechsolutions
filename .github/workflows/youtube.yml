name: Latest YouTube uploads

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCTEwUEqrf_OQ0lV4rbO_Beg"
          max_post_count: 5
          template: '- 📼 [$title]($url) <sub>`$date`</sub>$newline'
          date_format: yyyy-mm-dd
          commit_message: "chore: refresh latest uploads"
